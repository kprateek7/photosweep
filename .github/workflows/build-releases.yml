name: Build Windows & macOS Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows app bundle
        run: pyinstaller --clean --noconfirm photosweep.spec

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PhotoSweep -DestinationPath PhotoSweep-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-Windows-x64
          path: PhotoSweep-Windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build macOS .app bundle
        run: pyinstaller --clean --noconfirm photosweep.spec

      - name: Package macOS DMG
        run: |
          mkdir -p dmg_stage
          cp -R dist/PhotoSweep.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "PhotoSweep" -srcfolder dmg_stage -ov -format UDZO PhotoSweep-macOS-AppleSilicon.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-macOS-AppleSilicon
          path: PhotoSweep-macOS-AppleSilicon.dmg

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release-files/* \
            --title "PhotoSweep $TAG" \
            --notes "### Download & Install (No Python Required)

          - **Windows:** Download \`PhotoSweep-Windows-x64.zip\`, unzip it, and double-click \`PhotoSweep.exe\`. *(If Windows SmartScreen warns you, click **More info -> Run anyway**.)*
          - **macOS (Apple Silicon):** Download \`PhotoSweep-macOS-AppleSilicon.dmg\`, drag \`PhotoSweep.app\` into **Applications**, then **Right-click -> Open** the first time *(if macOS says the app is from an unidentified developer, open Terminal and run \`xattr -cr /Applications/PhotoSweep.app\`)*.

          All processing runs 100% locally on your computer."
